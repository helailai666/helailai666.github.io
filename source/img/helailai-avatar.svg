<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#1B2A45"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#8FA9C9"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F472B6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset=".45" stop-color="#FFB020" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="9"/>

  <!-- 左右光束 -->
  <polygon points="278,196 452,150 452,240 278,214" fill="url(#beamR)"/>
  <polygon points="234,196 60,150 60,240 234,214" fill="url(#beamL)"/>

  <!-- 灯室光晕 -->
  <circle cx="256" cy="200" r="74" fill="url(#lamp)"/>

  <!-- 礁石 -->
  <ellipse cx="256" cy="404" rx="128" ry="30" fill="#060C17"/>
  <path d="M128 404 Q256 356 384 404" fill="none" stroke="#22D3EE" stroke-opacity=".5" stroke-width="7"/>

  <!-- 塔身 -->
  <polygon points="212,400 300,400 282,236 230,236" fill="url(#tower)"/>
  <polygon points="224,300 288,300 284,268 228,268" fill="#F472B6"/>
  <polygon points="218,368 294,368 291,336 221,336" fill="#22D3EE"/>

  <!-- 廊台与灯室 -->
  <rect x="216" y="222" width="80" height="18" rx="6" fill="#0E1A2C"/>
  <rect x="228" y="176" width="56" height="48" rx="10" fill="#0E1A2C"/>
  <circle cx="256" cy="200" r="17" fill="#FFE28A"/>
  <polygon points="222,176 290,176 256,140" fill="#0E1A2C"/>

  <!-- 云与闪电 -->
  <path d="M300 96 q26 -30 56 -6 q30 -6 30 26 q0 24 -30 24 h-52 q-26 0 -26 -22 q0 -18 22 -22 z" fill="#16263F" stroke="#22D3EE" stroke-opacity=".55" stroke-width="6"/>
  <g transform="translate(-20 -16)">
    <polygon points="196 66 158 146 186 146 152 226 224 128 190 128 222 66" fill="#FFC53D" stroke="#F472B6" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
