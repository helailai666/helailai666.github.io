name: Hugo Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix LoveIt theme partials
        run: |
          # LoveIt theme stores partials in _partials/ but Hugo's partial function
          # looks in partials/. Create partials/ dir as a copy of _partials/
          if [ -d "themes/LoveIt/layouts/_partials" ]; then
            cp -r themes/LoveIt/layouts/_partials themes/LoveIt/layouts/partials
            echo "✅ Created partials/ from _partials/ in LoveIt theme"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
